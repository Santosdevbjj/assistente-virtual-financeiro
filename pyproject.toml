[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "assistente-virtual-financeiro"
version = "1.0.0"
description = "Assistente virtual financeiro educativo com IA generativa e guardrails."
requires-python = ">=3.12"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"
